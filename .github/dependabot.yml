# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: npm

    # root dir + children; single level, non-recursive (recursive would be "**/*")
    #   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#directories
    directories: [ "*" ]

    # Version-update schedules and cooldowns do not delay security updates.
    schedule:
      interval: daily
    cooldown:
      default-days: 7

    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#groups--
    groups:
      # Security fixes are event-driven, including fixes requiring a major update.
      security:
        applies-to: security-updates
        patterns: ["*"]
      prod:
        applies-to: version-updates
        dependency-type: "production"
        update-types: 
          - "minor"
          - "patch"
      dev:
        applies-to: version-updates
        dependency-type: "development"
        update-types: 
          - "minor"
          - "patch"
      prod-major:
        applies-to: version-updates
        dependency-type: "production"
        update-types: 
          - "major"
      dev-major:
        applies-to: version-updates
        dependency-type: "development"
        update-types: 
          - "major"

    allow:
      - dependency-type: "production"
      - dependency-type: "development"
