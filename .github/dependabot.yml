# Routine maintenance is batched; security fixes remain event-driven.
version: 2
updates:
  - package-ecosystem: npm
    # Include standalone examples as well as the root npm workspace.
    directories: ["*"]
    # These settings apply only to version updates, not security fixes.
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

    # Major upgrades are deliberate compatibility work. Security fixes may
    # still upgrade to a new major because allow.update-types is version-only.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      pepr:
        applies-to: version-updates
        patterns: ["pepr"]
      maintenance:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["pepr"]
