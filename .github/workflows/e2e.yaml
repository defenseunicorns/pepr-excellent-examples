name: E2E - Pepr Excellent Examples

permissions: read-all
on:
  workflow_dispatch:
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  changes:
    name: check changed files
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.paths.outputs.run-tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24

      - name: Decide whether tests are needed
        id: paths
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          let base, head, separator = '..';
          switch (process.env.GITHUB_EVENT_NAME) {
            case 'pull_request':
              base = event.pull_request.base.sha;
              head = event.pull_request.head.sha;
              separator = '...';
              break;
            case 'merge_group':
              base = event.merge_group.base_sha;
              head = event.merge_group.head_sha;
              break;
            case 'push':
              base = event.before;
              head = event.after;
              break;
          }

          // Manual runs and unavailable comparisons run the full suite.
          let runTests = true;
          if (base && head && !/^0+$/.test(base) && !/^0+$/.test(head)) {
            try {
              // Include both names of renames so code renamed to Markdown still runs CI.
              const paths = execFileSync('git', [
                'diff', '--no-renames', '--name-only', '-z', `${base}${separator}${head}`, '--'
              ], { encoding: 'utf8' }).split('\0').filter(Boolean);
              runTests = paths.some(path =>
                path !== 'LICENSE' && path !== 'CODEOWNERS' && !path.endsWith('.md')
              );
            } catch {
              console.warn('Could not compare commits; running full validation.');
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run-tests=${runTests}\n`);
          NODE

  harness:
    name: harness validation
    needs: [changes]
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint harness sources
        run: npx --no-install eslint _helpers/src --config eslint.config.mjs

      - name: Typecheck harness sources
        # Match Vitest's resolution of the existing extensionless imports.
        run: npx --no-install tsc --noEmit --project _helpers/tsconfig.json --moduleResolution bundler --module ESNext

      - name: Run harness unit tests
        # Invoke Vitest directly so its exit code reaches CI.
        run: npx --no-install vitest run --root _helpers unit.test.ts

  validation:
    name: dependency validation
    needs: [changes, harness, examples-matrix, excellent-examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require tests or an intentional ignored-file skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          MATRIX_RESULT: ${{ needs.examples-matrix.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          E2E_RESULT: ${{ needs.excellent-examples.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUN_TESTS" = false ]; then
            test "$HARNESS_RESULT" = skipped
            test "$MATRIX_RESULT" = skipped
            test "$E2E_RESULT" = skipped
            echo "Only Markdown, LICENSE, or CODEOWNERS changed; tests were intentionally skipped."
          else
            test "$RUN_TESTS" = true
            test "$HARNESS_RESULT" = success
            test "$MATRIX_RESULT" = success
            test "$E2E_RESULT" = success
          fi

  examples-matrix:
    name: job matrix
    needs: [changes]
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - name: clone pepr-excellent-examples
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: create matrix
        run: |
          matrix=$(
            node ".github/workflows/matrix.js" "$(pwd)"
          )
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
        id: create-matrix

  excellent-examples:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - examples-matrix
    if: needs.changes.outputs.run-tests == 'true' && needs.examples-matrix.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 32 # Roughly matches the number of E2E tests and below GitHub concurrency limit
      matrix: ${{ fromJSON(needs.examples-matrix.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - name: "install k3d"
        run: "curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash"
        shell: bash

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: install pepr-excellent-examples deps
        run: |
          npm ci

      - name: run e2e tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 6
          command: |
            npm run --workspace=${{ matrix.name }} test:e2e 
